<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title>PongMind</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #080B14;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
            font-family: Arial, sans-serif;
        }

        .game-title {
            margin: 0 0 8px;
            font-size: clamp(24px, 5vw, 32px);
            letter-spacing: 4px;
            color: #00A8FF;
            text-transform: uppercase;
        }

        .game-subtitle {
            margin: 0 0 10px;
            color: #9CA3AF;
            font-size: 13px;
            text-align: center;
        }

        .scoreboard {
            width: min(800px, 95vw, calc((100vh - 150px) * 4 / 3));
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 12px 24px;
            border: 1px solid #263248;
            border-radius: 10px;
            background: #0D1322;
            box-shadow: 0 0 18px rgba(0, 0, 0, 0.25);
        }

        .score-side {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 120px;
        }

        .score-side:last-child {
            justify-content: flex-end;
        }

        .score-label {
            color: #9CA3AF;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .score-value {
            font-size: 30px;
            font-weight: bold;
            line-height: 1;
        }

        .score-player {
            color: #00A8FF;
        }

        .score-ai {
            color: #FF4D6D;
        }

        .score-divider {
            color: #4B5563;
            font-size: 20px;
        }

        .match-status {
            min-width: 150px;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #9CA3AF;
            transition: opacity 0.18s ease, color 0.18s ease;
        }

        .game-wrapper {
            width: min(800px, 95vw, calc((100vh - 150px) * 4 / 3));
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 4 / 3;
            border: 2px solid #00A8FF;
            border-radius: 8px;
            background: #05070D;
            touch-action: none;
            box-shadow: 0 0 24px rgba(0, 168, 255, 0.12);
        }

        .controls-hint {
            margin: 10px 0 0;
            color: #6B7280;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1 class="game-title">PongMind</h1>
    <p class="game-subtitle">AI-powered Pong • Day 3 Prototype</p>

    <div class="scoreboard">
        <div class="score-side">
            <span class="score-label">You</span>
            <span class="score-value score-player" id="playerScore">0</span>
        </div>

        <span class="score-divider">:</span>

        <div class="score-side">
            <span class="score-value score-ai" id="opponentScore">0</span>
            <span class="score-label">AI</span>
        </div>

        <div class="match-status" id="matchStatus">READY</div>
    </div>

    <div class="game-wrapper">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

    <p class="controls-hint">Desktop: A / D or ← / → • Mobile: slide your finger across the game</p>

    <script src="game.js"></script>
</body>
</html>
