<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title>PongMind</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #080B14;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
            font-family: Arial, sans-serif;
        }

        .game-title {
            margin: 0 0 8px;
            font-size: clamp(24px, 5vw, 32px);
            letter-spacing: 4px;
            color: #00A8FF;
            text-transform: uppercase;
        }

        .game-subtitle {
            margin: 0 0 10px;
            color: #9CA3AF;
            font-size: 13px;
            text-align: center;
        }

        .scoreboard {
            width: min(800px, 95vw, calc((100vh - 150px) * 4 / 3));
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            grid-template-rows: auto auto;
            align-items: center;
            margin-bottom: 10px;
            padding: 12px 24px 10px;
            border: 1px solid #263248;
            border-radius: 10px;
            background: #0D1322;
            box-shadow: 0 0 18px rgba(0, 0, 0, 0.25);
        }

        .score-side {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 120px;
        }

        .score-side:last-child {
            justify-content: flex-end;
        }

        .score-label {
            color: #9CA3AF;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .score-value {
            font-size: 30px;
            font-weight: bold;
            line-height: 1;
        }

        .score-player {
            color: #00A8FF;
        }

        .score-ai {
            color: #FF4D6D;
        }

        .score-divider {
            color: #4B5563;
            font-size: 20px;
        }

        .score-status {
            grid-column: 1 / 4;
            margin-top: 8px;
            min-height: 16px;
            color: #9CA3AF;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
            text-align: center;
            text-transform: uppercase;
        }

        .game-wrapper {
            position: relative;
            width: min(800px, 95vw, calc((100vh - 150px) * 4 / 3));
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 4 / 3;
            border: 2px solid #00A8FF;
            border-radius: 8px;
            background: #05070D;
            touch-action: none;
            box-shadow: 0 0 24px rgba(0, 168, 255, 0.12);
        }

        /* Full-game-space score flash. The message itself stays in the scoreboard. */
        .score-flash {
            position: absolute;
            inset: 0;
            border-radius: 8px;
            pointer-events: none;
            opacity: 0;
            z-index: 2;
        }

        .score-flash.ai {
            animation: aiScoreFlash 1.45s ease-out;
        }

        .score-flash.player {
            animation: playerScoreFlash 1.45s ease-out;
        }

        @keyframes aiScoreFlash {
            0% {
                opacity: 0;
                background: radial-gradient(circle at center, rgba(255, 40, 70, 0) 0%, rgba(255, 40, 70, 0) 8%, rgba(255, 40, 70, 0) 100%);
            }
            35% {
                opacity: 0.28;
                background: radial-gradient(circle at center, rgba(255, 40, 70, 0.85) 0%, rgba(255, 40, 70, 0.45) 25%, rgba(255, 40, 70, 0.15) 55%, rgba(255, 40, 70, 0) 100%);
            }
            72% {
                opacity: 0.48;
                background: radial-gradient(circle at center, rgba(255, 40, 70, 0.95) 0%, rgba(255, 40, 70, 0.65) 45%, rgba(255, 40, 70, 0.35) 100%);
            }
            80% {
                opacity: 0.72;
                background: rgba(255, 40, 70, 0.9);
            }
            100% {
                opacity: 0;
                background: rgba(255, 40, 70, 0.9);
            }
        }

        @keyframes playerScoreFlash {
            0% {
                opacity: 0;
                background: radial-gradient(circle at center, rgba(0, 168, 255, 0) 0%, rgba(0, 168, 255, 0) 8%, rgba(0, 168, 255, 0) 100%);
            }
            35% {
                opacity: 0.28;
                background: radial-gradient(circle at center, rgba(0, 168, 255, 0.85) 0%, rgba(0, 168, 255, 0.45) 25%, rgba(0, 168, 255, 0.15) 55%, rgba(0, 168, 255, 0) 100%);
            }
            72% {
                opacity: 0.48;
                background: radial-gradient(circle at center, rgba(0, 168, 255, 0.95) 0%, rgba(0, 168, 255, 0.65) 45%, rgba(0, 168, 255, 0.35) 100%);
            }
            80% {
                opacity: 0.72;
                background: rgba(0, 168, 255, 0.9);
            }
            100% {
                opacity: 0;
                background: rgba(0, 168, 255, 0.9);
            }
        }

        .controls-hint {
            margin: 10px 0 0;
            color: #6B7280;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1 class="game-title">PongMind</h1>
    <p class="game-subtitle">AI-powered Pong • Day 3 Prototype</p>

    <div class="scoreboard">
        <div class="score-side">
            <span class="score-label">You</span>
            <span class="score-value score-player" id="playerScore">0</span>
        </div>

        <span class="score-divider">:</span>

        <div class="score-side">
            <span class="score-value score-ai" id="opponentScore">0</span>
            <span class="score-label">AI</span>
        </div>

        <div class="score-status" id="scoreStatus">READY</div>
    </div>

    <div class="game-wrapper">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div class="score-flash" id="scoreFlash"></div>
    </div>

    <p class="controls-hint">Desktop: A / D or ← / → • Mobile: slide your finger across the game</p>

    <script src="game.js"></script>
</body>
</html>
